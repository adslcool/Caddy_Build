name: Build and release Caddy

on:
  schedule:
    # Daily at 08:00 Beijing time (UTC+8).
    - cron: '0 0 * * *'

  workflow_dispatch:
    inputs:
      caddy_version:
        description: 'Caddy 版本：latest 或 v2.x.x'
        required: false
        default: latest
        type: string

  push:
    # Run on the initial workflow upload and later workflow changes.
    branches:
      - '**'
    paths:
      - '.github/workflows/Caddy_Build.yml'
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: caddy-release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve Caddy version

    if: >-
      github.event_name != 'push' ||
      github.ref_type == 'tag' ||
      github.ref_name == github.event.repository.default_branch

    runs-on: ubuntu-24.04

    outputs:
      caddy_version: ${{ steps.version.outputs.caddy_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      deb_version: ${{ steps.version.outputs.deb_version }}
      should_build: ${{ steps.version.outputs.should_build }}

    steps:
      - name: Resolve upstream Caddy version
        id: version

        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_CADDY_VERSION: ${{ inputs.caddy_version || 'latest' }}

        shell: bash

        run: |
          set -Eeuo pipefail

          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            caddy_version="$GITHUB_REF_NAME"

          elif [[ "$REQUESTED_CADDY_VERSION" == 'latest' ]]; then
            caddy_version="$(gh api \
              repos/caddyserver/caddy/releases/latest \
              --jq '.tag_name')"

          else
            caddy_version="$REQUESTED_CADDY_VERSION"
          fi

          if [[ ! "$caddy_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9._-]+)?$ ]]; then
            printf '无效的 Caddy 版本：%s\n' "$caddy_version" >&2
            exit 1
          fi

          should_build=true

          if [[ "$GITHUB_EVENT_NAME" == 'schedule' ||
                ( "$GITHUB_EVENT_NAME" == 'push' && "$GITHUB_REF_TYPE" == 'branch' ) ]]; then
            # Listing releases fails the check on API errors instead of treating
            # a network or permissions failure as an unpublished version.
            releases_json="$(gh api --paginate --slurp \
              "repos/$GH_REPO/releases?per_page=100")"

            published="$(jq -r --arg version "$caddy_version" \
              '["caddy-\($version)-windows-amd64.zip",
                "caddy-\($version)-linux-amd64.tar.gz",
                "caddy-\($version)-linux-amd64.deb",
                "caddy-\($version)-linux-arm64.tar.gz",
                "caddy-\($version)-linux-arm64.deb",
                "SHA256SUMS-\($version).txt"] as $required |
                any(.[][];
                .tag_name == $version and .draft == false and
                (.assets as $assets |
                  all($required[]; . as $name |
                    any($assets[]; .name == $name and .size > 0))))' \
              <<<"$releases_json")"

            if [[ "$published" == 'true' ]]; then
              should_build=false
              printf 'Caddy %s 已发布且附件完整，跳过构建。\n' "$caddy_version"
            else
              printf 'Caddy %s 尚未发布或附件不完整，开始构建。\n' "$caddy_version"
            fi
          fi

          {
            printf 'should_build=%s\n' "$should_build"
            printf 'caddy_version=%s\n' "$caddy_version"
            printf 'release_tag=%s\n' "$caddy_version"

            printf 'deb_version=%s+build%s\n' \
              "${caddy_version#v}" \
              "$GITHUB_RUN_NUMBER"
          } >>"$GITHUB_OUTPUT"

          printf '本次检查 Caddy 版本：%s\n' "$caddy_version"

  build:
    name: Build all platforms and publish GitHub Release

    needs: prepare

    if: needs.prepare.outputs.should_build == 'true'

    runs-on: ubuntu-24.04

    env:
      CADDY_VERSION: ${{ needs.prepare.outputs.caddy_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install latest stable Go
        uses: actions/setup-go@v7

        with:
          go-version: stable
          check-latest: true
          cache: false

      - name: Display Go version
        run: go version

      - name: Install xcaddy

        shell: bash

        run: |
          set -Eeuo pipefail

          go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

          printf '%s/bin\n' "$(go env GOPATH)" >>"$GITHUB_PATH"

      - name: Build custom Caddy

        env:
          CGO_ENABLED: '0'
          CADDY_VERSION: ${{ needs.prepare.outputs.caddy_version }}

        shell: bash

        run: |
          set -Eeuo pipefail

          mkdir -p release

          for platform in windows-amd64 linux-amd64 linux-arm64; do
            export GOOS="${platform%-*}"
            export GOARCH="${platform##*-}"
            mkdir -p "build/$platform"

            binary_name='caddy'

            if [[ "$GOOS" == 'windows' ]]; then
              binary_name='caddy.exe'
            fi

            xcaddy build "$CADDY_VERSION" \
              --with github.com/mholt/caddy-l4 \
              --with github.com/greenpau/caddy-security \
              --with github.com/caddy-dns/cloudflare \
              --with github.com/WeidiDeng/caddy-cloudflare-ip \
              --with github.com/xcaddyplugins/caddy-trusted-cloudfront \
              --with github.com/mholt/caddy-webdav \
              --with github.com/porech/caddy-maxmind-geolocation \
              --output "build/$platform/$binary_name"

            if [[ "$GOOS" == 'linux' && "$GOARCH" == 'amd64' ]]; then
              "build/$platform/$binary_name" version

              "build/$platform/$binary_name" list-modules \
                --skip-standard \
                --packages \
                --versions
            fi
          done

      - name: Create Windows archive

        shell: bash

        run: |
          set -Eeuo pipefail

          cd build/windows-amd64

          sha256sum caddy.exe >SHA256SUMS

          zip -9 \
            "../../release/caddy-$CADDY_VERSION-windows-amd64.zip" \
            caddy.exe \
            SHA256SUMS

      - name: Create Linux archive

        shell: bash

        run: |
          set -Eeuo pipefail

          for platform in linux-amd64 linux-arm64; do
            (
              cd "build/$platform"
              sha256sum caddy >SHA256SUMS
              tar -czf "../../release/caddy-$CADDY_VERSION-$platform.tar.gz" caddy SHA256SUMS
            )
          done

      - name: Build Debian package with systemd service

        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.deb_version }}

        shell: bash

        run: |
          set -Eeuo pipefail

          for PACKAGE_ARCH in amd64 arm64; do
          package_root="$RUNNER_TEMP/caddy-package-$PACKAGE_ARCH"

          mkdir -p \
            "$package_root/DEBIAN" \
            "$package_root/usr/bin" \
            "$package_root/usr/lib/systemd/system" \
            "$package_root/etc/caddy"

          install \
            -m 0755 \
            "build/linux-$PACKAGE_ARCH/caddy" \
            "$package_root/usr/bin/caddy"

          cat >"$package_root/DEBIAN/control" <<EOF
          Package: caddy-custom
          Version: $PACKAGE_VERSION
          Section: httpd
          Priority: optional
          Architecture: $PACKAGE_ARCH
          Depends: ca-certificates, systemd
          Provides: caddy
          Conflicts: caddy
          Replaces: caddy
          Maintainer: adslcool <noreply@github.com>
          Homepage: https://github.com/adslcool/Caddy_Build
          Description: Custom Caddy server with Cloudflare, layer4, WebDAV and security plugins
           Pre-built Caddy web server with a root-run systemd service for Debian.
          EOF

          cat >"$package_root/DEBIAN/conffiles" <<'EOF'
          /etc/caddy/Caddyfile
          /etc/caddy/caddy.env
          EOF

          cat >"$package_root/etc/caddy/Caddyfile" <<'EOF'
          :80 {
              respond "Caddy custom build is running."
          }
          EOF

          : >"$package_root/etc/caddy/caddy.env"

          cat >"$package_root/usr/lib/systemd/system/caddy.service" <<'EOF'
          [Unit]
          Description=Caddy custom web server
          Documentation=https://caddyserver.com/docs/
          After=network.target network-online.target
          Wants=network-online.target

          [Service]
          Type=notify

          User=root
          Group=root

          Environment=XDG_DATA_HOME=/var/lib/caddy/.local/share
          Environment=XDG_CONFIG_HOME=/var/lib/caddy/.config
          EnvironmentFile=-/etc/caddy/caddy.env

          ExecStartPre=/usr/bin/caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
          ExecReload=/usr/bin/caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile --force

          TimeoutStopSec=5s
          LimitNOFILE=1048576

          PrivateTmp=true
          ProtectSystem=full

          Restart=on-failure
          RestartPreventExitStatus=1
          RestartSec=3s

          [Install]
          WantedBy=multi-user.target
          EOF

          cat >"$package_root/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -eu

          case "$1" in
              configure)
                  install -d \
                      -o root \
                      -g root \
                      -m 0700 \
                      /var/lib/caddy \
                      /var/log/caddy

                  chown root:root \
                      /etc/caddy/Caddyfile \
                      /etc/caddy/caddy.env

                  chmod 0644 /etc/caddy/Caddyfile
                  chmod 0600 /etc/caddy/caddy.env

                  if [ -d /run/systemd/system ]; then
                      systemctl daemon-reload
                      systemctl enable caddy.service
                      systemctl restart caddy.service
                  fi
                  ;;
          esac
          EOF

          cat >"$package_root/DEBIAN/prerm" <<'EOF'
          #!/bin/sh
          set -eu

          case "$1" in
              remove)
                  if [ -d /run/systemd/system ]; then
                      systemctl disable --now caddy.service || true
                  fi
                  ;;
          esac
          EOF

          cat >"$package_root/DEBIAN/postrm" <<'EOF'
          #!/bin/sh
          set -eu

          case "$1" in
              remove|purge)
                  if [ -d /run/systemd/system ]; then
                      systemctl daemon-reload || true
                  fi
                  ;;
          esac
          EOF

          chmod 0755 \
            "$package_root/DEBIAN/postinst" \
            "$package_root/DEBIAN/prerm" \
            "$package_root/DEBIAN/postrm"

          chmod 0644 "$package_root/etc/caddy/Caddyfile"
          chmod 0600 "$package_root/etc/caddy/caddy.env"

          package_path="release/caddy-$CADDY_VERSION-linux-${PACKAGE_ARCH}.deb"

          dpkg-deb \
            --build \
            --root-owner-group \
            "$package_root" \
            "$package_path"

          dpkg-deb --info "$package_path"
          done

      - name: Create complete SHA-256 manifest

        shell: bash

        run: |
          set -Eeuo pipefail

          for file in \
            "caddy-$CADDY_VERSION-windows-amd64.zip" \
            "caddy-$CADDY_VERSION-linux-amd64.tar.gz" \
            "caddy-$CADDY_VERSION-linux-amd64.deb" \
            "caddy-$CADDY_VERSION-linux-arm64.tar.gz" \
            "caddy-$CADDY_VERSION-linux-arm64.deb"; do
            test -s "release/$file"
          done

          cd release

          sha256sum -- caddy-* >"SHA256SUMS-$CADDY_VERSION.txt"

          sha256sum --check "SHA256SUMS-$CADDY_VERSION.txt"

          cat "SHA256SUMS-$CADDY_VERSION.txt"

      - name: Create or update GitHub Release

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          CADDY_VERSION: ${{ needs.prepare.outputs.caddy_version }}

          TARGET_COMMIT: ${{ github.sha }}

        shell: bash

        run: |
          set -Eeuo pipefail

          cat >"$RUNNER_TEMP/release-notes.md" <<EOF
          ## Caddy $CADDY_VERSION 自定义构建版

          基于 Caddy $CADDY_VERSION 构建，集成以下第三方插件。

          ### 下载文件

          | 平台 | 文件名 |
          | --- | --- |
          | Windows AMD64 | caddy-$CADDY_VERSION-windows-amd64.zip |
          | Linux AMD64 | caddy-$CADDY_VERSION-linux-amd64.tar.gz |
          | Debian / Ubuntu AMD64 | caddy-$CADDY_VERSION-linux-amd64.deb |
          | Linux ARM64 | caddy-$CADDY_VERSION-linux-arm64.tar.gz |
          | Debian / Ubuntu ARM64 | caddy-$CADDY_VERSION-linux-arm64.deb |
          | SHA-256 校验文件 | SHA256SUMS-$CADDY_VERSION.txt |

          ### 集成插件

          - caddy-l4：四层 TCP/UDP 代理（github.com/mholt/caddy-l4）
          - caddy-security：身份认证与访问控制（github.com/greenpau/caddy-security）
          - caddy-dns/cloudflare：Cloudflare DNS 支持（github.com/caddy-dns/cloudflare）
          - caddy-cloudflare-ip：Cloudflare 代理 IP 支持（github.com/WeidiDeng/caddy-cloudflare-ip）
          - caddy-trusted-cloudfront：CloudFront 可信代理支持（github.com/xcaddyplugins/caddy-trusted-cloudfront）
          - caddy-webdav：WebDAV 文件服务（github.com/mholt/caddy-webdav）
          - caddy-maxmind-geolocation：MaxMind IP 地理位置查询（github.com/porech/caddy-maxmind-geolocation）

          ### 安装与校验

          - 根据操作系统和处理器架构下载对应文件。
          - Debian / Ubuntu 安装包会自动安装、启用并启动 caddy.service。
          - Caddy 服务以 root 用户运行，配置文件为 /etc/caddy/Caddyfile。
          - 下载后可使用 SHA256SUMS-$CADDY_VERSION.txt 校验发布文件的完整性。
          - 压缩包内同时附带用于校验 Caddy 可执行文件的 SHA256SUMS。
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload \
              "$RELEASE_TAG" \
              release/* \
              --clobber

            gh release edit \
              "$RELEASE_TAG" \
              --draft=false \
              --title "Caddy $CADDY_VERSION 自定义构建版" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --latest

          else
            gh release create \
              "$RELEASE_TAG" \
              release/* \
              --target "$TARGET_COMMIT" \
              --title "Caddy $CADDY_VERSION 自定义构建版" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --latest
          fi

